[project]
name = "apollo-charting"
version = "1.0.0"
description = "Stateless MCP server that renders shadcn/Recharts chart specs to PNG."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["mcp>=1.2,<2"]

[dependency-groups]
dev = ["mcp[cli]>=1.2,<2"]

[project.scripts]
apollo-charting = "apollo_charting.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/apollo_charting"]

[tool.uv]
package = true
