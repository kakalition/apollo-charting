name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install pinned Node dependencies
        run: npm ci
      - name: Build the chart bundle
        run: node scripts/build.mjs
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Sync the Python environment
        run: uv sync
      - name: Engine smoke test
        run: PY=.venv/bin/python bash tests/smoke.sh
      - name: MCP smoke test
        run: uv run python tests/mcp_smoke.py
